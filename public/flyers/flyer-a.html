<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tuwafute Machozi — Private Island Travel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      @page {
        size: A5;
        margin: 0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 148mm;
        height: 210mm;
        overflow: hidden;
        background: #0a1418;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .page {
        position: relative;
        width: 148mm;
        height: 210mm;
        overflow: hidden;
        color: #f4ece0;
      }
      .hero {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 46% 68%;
        display: block;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          118deg,
          rgba(8, 18, 22, 0.72) 0%,
          rgba(8, 18, 22, 0.28) 28%,
          rgba(8, 18, 22, 0) 52%,
          rgba(8, 18, 22, 0) 100%
        );
        pointer-events: none;
      }
      .mast {
        position: absolute;
        top: 10mm;
        left: 9mm;
        z-index: 2;
        width: 118mm;
      }
      .place {
        font-family: "Bodoni Moda", "Times New Roman", serif;
        font-size: 2.2mm;
        letter-spacing: 0.58em;
        text-transform: uppercase;
        color: #d4b06a;
      }
      h1 {
        margin-top: 4.6mm;
        font-family: "Bodoni Moda", "Times New Roman", serif;
        font-weight: 400;
        font-size: 14.2mm;
        line-height: 0.86;
        letter-spacing: 0.018em;
        color: #f7f1e6;
      }
      h1 em {
        display: block;
        font-style: italic;
        font-weight: 400;
        font-size: 15.4mm;
        letter-spacing: 0.01em;
        margin-left: 14mm;
      }
      .gold-rule {
        width: 14mm;
        height: 0.22mm;
        margin: 5.4mm 0 4.2mm;
        background: #c9a86a;
      }
      .one-line {
        font-family: "Cormorant Garamond", Palatino, Georgia, serif;
        font-size: 3.85mm;
        font-style: italic;
        line-height: 1.28;
        max-width: 78mm;
        color: #f4ece0;
      }
      .card {
        position: absolute;
        left: 0;
        bottom: 11mm;
        z-index: 3;
        width: 82mm;
        background: #f3eadc;
        color: #14110e;
        padding: 5.2mm 7mm 5mm 9mm;
      }
      .services {
        display: flex;
        flex-direction: column;
        gap: 1.8mm;
        margin-bottom: 3.6mm;
      }
      .services li {
        list-style: none;
        font-family: "Bodoni Moda", "Times New Roman", serif;
        font-size: 2.15mm;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #1a1612;
      }
      .services li::before {
        content: "";
        display: inline-block;
        width: 3.8mm;
        height: 0.18mm;
        margin-right: 2.4mm;
        margin-bottom: 0.85mm;
        background: #b08a4a;
        vertical-align: middle;
      }
      .charity {
        font-family: "Cormorant Garamond", Palatino, Georgia, serif;
        font-size: 3.25mm;
        line-height: 1.32;
        color: #2a241c;
        max-width: 72mm;
      }
      .founder {
        margin-top: 3.2mm;
        font-family: "Cormorant Garamond", Palatino, Georgia, serif;
        font-size: 3.05mm;
        line-height: 1.36;
        color: #1a1612;
      }
      .founder .who {
        font-family: "Bodoni Moda", "Times New Roman", serif;
        font-size: 2.05mm;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: #8a6a32;
      }
      .qr-object {
        position: absolute;
        right: 8mm;
        bottom: 8mm;
        z-index: 4;
        width: 34mm;
        background: #f7f1e6;
        padding: 2.5mm 2.5mm 2.7mm;
        box-shadow: 0 1.4mm 5mm rgba(0, 0, 0, 0.32);
      }
      .qr-object img {
        display: block;
        width: 29mm;
        height: 29mm;
        background: #fff;
        padding: 2.4mm;
      }
      .qr-object p {
        margin-top: 2mm;
        font-family: "Bodoni Moda", "Times New Roman", serif;
        font-size: 1.8mm;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #1a1612;
        text-align: center;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <article class="page">
      <img
        class="hero"
        src="../images/places/mnemba.jpg"
        alt="Mnemba atoll, Zanzibar — white sand spit in turquoise water"
      />
      <div class="scrim"></div>
      <header class="mast">
        <p class="place">Zanzibar</p>
        <h1>Tuwafute <em>Machozi</em></h1>
        <div class="gold-rule"></div>
        <p class="one-line">Private island tours. Stone Town. Reef. Stays from two to five stars.</p>
      </header>
      <aside class="card">
        <ul class="services">
          <li>Island tours</li>
          <li>Stone Town &amp; reef</li>
          <li>2–5★ stays</li>
        </ul>
        <p class="charity">Book a tour — forty percent funds charity on the island.</p>
        <p class="founder">
          <span class="who">Joseph Kitali, founder</span><br />
          WhatsApp +255 622 434 657
        </p>
      </aside>
      <div class="qr-object">
        <img src="qr.png" alt="QR code to tuwafutemachozi.com" />
        <p>Scan to<br />explore</p>
      </div>
    </article>
  </body>
</html>
